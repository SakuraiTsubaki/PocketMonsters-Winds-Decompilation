name: Census all official Japanese PNG assets

on:
  push:
    paths:
      - '.github/workflows/census-official-jp-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jp-official-png-census
  cancel-in-progress: true

jobs:
  census-png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crawl bounded Japanese official surface and import PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from collections import deque
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote
          from urllib.request import Request, urlopen

          ROOT='https://www.pokemon.co.jp/ex/winds_waves/ja/'
          HOST='www.pokemon.co.jp'
          SITE='/ex/winds_waves/'
          JA='/ex/winds_waves/ja/'
          MAX_PAGES=200
          MAX_RESOURCES=250
          OUT=Path('assets/public/jp/site')
          MANIFEST=Path('manifests/jp-public-png-census.json')
          OUT.mkdir(parents=True,exist_ok=True)
          MANIFEST.parent.mkdir(parents=True,exist_ok=True)

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.attrs=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if v and k in {'href','src','srcset','poster'}: self.attrs.append((tag,k,v))

          token=re.compile(r'''(?P<u>(?:https?:)?//[^\s"'<>]+?\.(?:png|css|js)(?:\?[^\s"'<>)]*)?|(?:\.\.?/|/)[^\s"'<>]+?\.(?:png|css|js)(?:\?[^\s"'<>)]*)?|[A-Za-z0-9_./%-]+\.(?:png|css|js)(?:\?[^\s"'<>)]*)?)''',re.I)

          def norm(base,raw):
              raw=raw.strip().strip('"\'').replace('\\/','/')
              if not raw or raw.startswith(('data:','mailto:','javascript:')): return None
              u=urljoin(base,raw); p=urlparse(u)
              if p.scheme not in {'http','https'} or p.netloc!=HOST or not p.path.startswith(SITE): return None
              return f'https://{HOST}{p.path}'

          def get(url,binary=False,timeout=6):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Generation-X-PNG-census/2.0)'})
              with urlopen(req,timeout=timeout) as r:
                  b=r.read()
              return b if binary else b.decode('utf-8','ignore')

          hash_to_path={}
          for f in sorted(Path('assets').rglob('*.png')) if Path('assets').exists() else []:
              try: hash_to_path.setdefault(hashlib.sha256(f.read_bytes()).hexdigest(),f.as_posix())
              except OSError: pass

          pages=deque([ROOT]); resources=deque(); seen_pages=set(); seen_res=set(); pngs=set(); errors=[]
          while pages and len(seen_pages)<MAX_PAGES:
              u=pages.popleft()
              if u in seen_pages: continue
              seen_pages.add(u)
              try: text=get(u)
              except Exception as e:
                  errors.append({'url':u,'stage':'html','error':repr(e)}); continue
              p=P()
              try: p.feed(text)
              except Exception as e: errors.append({'url':u,'stage':'html-parse','error':repr(e)})
              candidates=[]
              for tag,k,v in p.attrs:
                  vals=[x.strip().split()[0] for x in v.split(',') if x.strip()] if k=='srcset' else [v]
                  candidates += [(tag,k,x) for x in vals]
              candidates += [('inline','token',m.group('u')) for m in token.finditer(text)]
              for tag,k,raw in candidates:
                  x=norm(u,raw)
                  if not x: continue
                  path=urlparse(x).path.lower()
                  if path.endswith('.png'): pngs.add(x)
                  elif path.endswith(('.css','.js')): resources.append(x)
                  elif tag=='a' and k=='href' and urlparse(x).path.startswith(JA): pages.append(x)
              for tag,k,raw in p.attrs:
                  if tag=='a' and k=='href':
                      x=norm(u,raw)
                      if x and urlparse(x).path.startswith(JA) and not urlparse(x).path.lower().endswith(('.png','.css','.js')): pages.append(x)

          while resources and len(seen_res)<MAX_RESOURCES:
              u=resources.popleft()
              if u in seen_res: continue
              seen_res.add(u)
              try: text=get(u)
              except Exception as e:
                  errors.append({'url':u,'stage':'resource','error':repr(e)}); continue
              for m in token.finditer(text):
                  x=norm(u,m.group('u'))
                  if not x: continue
                  path=urlparse(x).path.lower()
                  if path.endswith('.png'): pngs.add(x)
                  elif path.endswith(('.css','.js')) and len(seen_res)+len(resources)<MAX_RESOURCES*2: resources.append(x)

          def download(u):
              try:
                  b=get(u,True,10)
                  if not b.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('invalid PNG signature')
                  return u,b,None
              except Exception as e: return u,None,repr(e)

          results={}
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs=[ex.submit(download,u) for u in sorted(pngs)]
              for fut in as_completed(futs):
                  u,b,e=fut.result(); results[u]=(b,e)

          entries=[]; new_files=[]
          for u in sorted(pngs):
              b,e=results[u]
              if e:
                  entries.append({'source_url':u,'status':'download-error','error':e}); continue
              h=hashlib.sha256(b).hexdigest(); existing=hash_to_path.get(h)
              if existing:
                  path=existing; dedup=True
              else:
                  rel=unquote(urlparse(u).path[len(SITE):]).lstrip('/')
                  rel=os.path.normpath(rel).replace('\\','/')
                  if rel=='..' or rel.startswith('../'):
                      entries.append({'source_url':u,'status':'path-error'}); continue
                  dest=OUT/rel; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(b)
                  path=dest.as_posix(); hash_to_path[h]=path; new_files.append(path); dedup=False
              entries.append({'source_url':u,'repository_path':path,'sha256':h,'size':len(b),'deduplicated_to_existing':dedup,'status':'verified-png'})

          manifest={
            'schema_version':2,'research_date':'2026-09-15','baseline':'Japanese official Winds/Waves mini-site','root_url':ROOT,
            'scope':'Reachable Japanese HTML plus same-site referenced JS/CSS; PNG bytes verified and SHA-256 deduplicated.',
            'limits':{'max_html_pages':MAX_PAGES,'max_text_resources':MAX_RESOURCES},
            'html_pages_crawled':len(seen_pages),'text_resources_scanned':len(seen_res),'png_urls_discovered':len(pngs),
            'verified_png_count':sum(1 for x in entries if x.get('status')=='verified-png'),
            'download_error_count':sum(1 for x in entries if x.get('status')=='download-error'),
            'new_unique_png_count':len(new_files),'entries':entries,'crawl_errors':errors,
            'completion_note':'Represents the currently reachable Japanese official surface under the recorded bounded crawl. Errors remain explicit and must be retried; later site changes require rerun.'}
          MANIFEST.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/new_png_files.txt').write_text('\n'.join(new_files)+('\n' if new_files else ''),encoding='utf-8')
          print(json.dumps({k:manifest[k] for k in ['html_pages_crawled','text_resources_scanned','png_urls_discovered','verified_png_count','download_error_count','new_unique_png_count']},indent=2))
          PY

      - name: Commit PNGs first in small batches, then manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t files < /tmp/new_png_files.txt
          n=${#files[@]}; batch=1
          for ((i=0;i<n;i+=8)); do
            chunk=("${files[@]:i:8}")
            git add -- "${chunk[@]}"
            git commit -m "Add Japanese official PNG census chunk $(printf '%03d' "$batch")"
            batch=$((batch+1))
          done
          git add manifests/jp-public-png-census.json
          if ! git diff --cached --quiet; then git commit -m 'Record Japanese official PNG census manifest'; fi
          git push
