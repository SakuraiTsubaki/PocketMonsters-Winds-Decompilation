name: Finalize current Japanese PNG census

on:
  push:
    paths:
      - '.github/workflows/finalize-jp-png-census.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify non-reproduced PNG candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('manifests/jp-public-png-census.json')
          diagnostic_path = Path('manifests/jp-png-unresolved-context.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          diagnostic = json.loads(diagnostic_path.read_text(encoding='utf-8'))

          targets = {'image_1100.png', 'image_1101.png'}
          diagnostic_matches = diagnostic.get('matches', [])
          matched_targets = {m.get('target') for m in diagnostic_matches}

          changed = 0
          for entry in data.get('entries', []):
              source = entry.get('source_url', '')
              name = source.rsplit('/', 1)[-1]
              if name not in targets:
                  continue
              if name in matched_targets:
                  continue
              entry['status'] = 'candidate-not-reproduced'
              entry['resolution_status'] = 'not-currently-reproducible'
              entry['classification_note'] = (
                  'No literal reference was reproduced across the current 11 Japanese official HTML pages and the '
                  'successfully scanned linked resources, and no valid PNG was found in the tested general or page-relative '
                  'official directories. Preserved as a historical parser candidate; not counted as a current official PNG.'
              )
              entry.pop('error', None)
              changed += 1

          verified_statuses = {'verified-png', 'verified-png-resolved'}
          data['verified_png_count'] = sum(1 for e in data.get('entries', []) if e.get('status') in verified_statuses)
          data['actionable_unresolved_count'] = sum(
              1 for e in data.get('entries', [])
              if str(e.get('resolution_status', '')).startswith('unresolved')
          )
          data['non_reproduced_candidate_count'] = sum(
              1 for e in data.get('entries', []) if e.get('status') == 'candidate-not-reproduced'
          )
          data['download_error_count'] = sum(
              1 for e in data.get('entries', []) if e.get('status') == 'download-error'
          )
          data['current_surface_status'] = 'closed-with-non-reproduced-candidates'
          data['current_surface_note'] = (
              'For the currently reachable Japanese official surface, all reproducible PNG references found by the census '
              'are stored or hash-deduplicated in the repository. Two historical parser candidates are retained separately '
              'because they could not be reproduced as current literal references or valid PNG files. Future site revisions '
              'must be recrawled.'
          )
          data['finalization'] = {
              'date': '2026-09-15',
              'entries_reclassified': changed,
              'diagnostic_match_count': diagnostic.get('match_count', 0),
              'actionable_unresolved_count': data['actionable_unresolved_count'],
              'non_reproduced_candidate_count': data['non_reproduced_candidate_count']
          }

          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(data['finalization'], indent=2))
          PY

      - name: Commit final classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/jp-public-png-census.json
          if git diff --cached --quiet; then
            echo 'No classification changes.'
            exit 0
          fi
          git commit -m 'Finalize current Japanese PNG census classification'
          git push
