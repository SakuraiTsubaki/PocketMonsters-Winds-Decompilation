name: Resolve final Japanese PNG candidates

on:
  push:
    paths:
      - '.github/workflows/resolve-jp-png-final-two.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-final:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe nested official page directories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, unquote

          BASE='https://www.pokemon.co.jp/ex/winds_waves/'
          SITE='/ex/winds_waves/'
          M=Path('manifests/jp-public-png-census.json')
          OUT=Path('assets/public/jp/site')
          data=json.loads(M.read_text(encoding='utf-8'))
          targets=[e for e in data['entries'] if e.get('resolution_status')=='unresolved']

          page_dirs=[
            'ja/','ja/pokemon/','ja/news/',
            'ja/pokemon/202602_01/','ja/pokemon/202602_02/','ja/pokemon/202602_03/','ja/pokemon/202602_04/',
            'ja/news/202602_01/','ja/news/202602_02/','ja/news/202602_03/','ja/news/202605_01/',
            'pokemon/202602_01/','pokemon/202602_02/','pokemon/202602_03/','pokemon/202602_04/',
            'news/202602_01/','news/202602_02/','news/202602_03/','news/202605_01/',
            'images/ja/pokemon/202602_01/','images/ja/pokemon/202602_02/','images/ja/pokemon/202602_03/','images/ja/pokemon/202602_04/',
            'images/ja/news/202602_01/','images/ja/news/202602_02/','images/ja/news/202602_03/','images/ja/news/202605_01/'
          ]
          dirs=[]
          for d in page_dirs:
            dirs += [d, d+'images/', d+'img/', d+'assets/']
          dirs=list(dict.fromkeys(dirs))

          def get_png(url):
            req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Generation-X-PNG-final-resolver/1.0)'})
            with urlopen(req,timeout=4) as r: b=r.read()
            if not b.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('invalid PNG')
            return b

          hash_to_path={}
          for f in Path('assets').rglob('*.png'):
            try: hash_to_path.setdefault(hashlib.sha256(f.read_bytes()).hexdigest(),f.as_posix())
            except OSError: pass

          probes=[]
          for e in targets:
            name=Path(urlparse(e['source_url']).path).name
            for d in dirs: probes.append((e['source_url'],BASE+d+name))

          found={}
          def probe(pair):
            key,url=pair
            try: return key,url,get_png(url),None
            except Exception as exc: return key,url,None,type(exc).__name__

          with ThreadPoolExecutor(max_workers=32) as ex:
            futs=[ex.submit(probe,p) for p in probes]
            for f in as_completed(futs):
              key,url,b,err=f.result()
              if b is not None and key not in found: found[key]=(url,b)

          new_files=[]
          for e in targets:
            e['extended_probe_directories']=dirs
            hit=found.get(e['source_url'])
            if not hit:
              e['resolution_status']='unresolved-after-extended-probe'
              e['resolution_error']='No PNG found in general or known page-relative official directories.'
              continue
            url,b=hit; h=hashlib.sha256(b).hexdigest(); existing=hash_to_path.get(h)
            if existing: path=existing; dedup=True
            else:
              rel=unquote(urlparse(url).path[len(SITE):]).lstrip('/')
              rel=os.path.normpath(rel).replace('\\','/')
              dest=OUT/rel; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(b)
              path=dest.as_posix(); hash_to_path[h]=path; new_files.append(path); dedup=False
            e.update({'status':'verified-png-resolved','resolution_status':'resolved-extended','resolved_url':url,'repository_path':path,'sha256':h,'size':len(b),'deduplicated_to_existing':dedup})
            e.pop('error',None); e.pop('resolution_error',None)

          data['verified_png_count']=sum(1 for e in data['entries'] if e.get('status') in {'verified-png','verified-png-resolved'})
          data['download_error_count']=sum(1 for e in data['entries'] if e.get('status')=='download-error')
          data['remaining_unresolved_count']=sum(1 for e in data['entries'] if str(e.get('resolution_status','')).startswith('unresolved'))
          data['extended_probe']={'date':'2026-09-15','target_count':len(targets),'resolved_count':sum(1 for e in targets if e.get('status')=='verified-png-resolved'),'remaining_unresolved_count':sum(1 for e in targets if str(e.get('resolution_status','')).startswith('unresolved')),'new_unique_png_count':len(new_files)}
          M.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/final_new_files.txt').write_text('\n'.join(new_files)+('\n' if new_files else ''),encoding='utf-8')
          print(json.dumps(data['extended_probe'],indent=2))
          PY

      - name: Commit any PNG first, then manifest classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t files < /tmp/final_new_files.txt
          if ((${#files[@]}>0)); then git add -- "${files[@]}" && git commit -m 'Add final resolved Japanese official PNGs'; fi
          git add manifests/jp-public-png-census.json
          git commit -m 'Classify final Japanese PNG candidates'
          git push
