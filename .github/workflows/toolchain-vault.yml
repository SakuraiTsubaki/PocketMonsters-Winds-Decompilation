name: Persistent Generation X toolchain vault

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolchain-vault.yml'
      - 'setup-dev-env.sh'

permissions:
  contents: write

concurrency:
  group: genx-toolchain-vault-main
  cancel-in-progress: false

jobs:
  publish-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the repository toolchain once
        shell: bash
        run: |
          set -euxo pipefail
          export GENX_TOOLCHAIN_HOME="$RUNNER_TEMP/generation-x-toolchain"
          export GENX_BIN_DIR="$GENX_TOOLCHAIN_HOME/bin"
          bash setup-dev-env.sh
          "$GENX_BIN_DIR/genx-python" - <<'PY'
          import capstone, keystone, lief, elftools, construct, kaitaistruct, zstandard, lz4
          print('python RE modules: OK')
          PY
          test -x "$GENX_BIN_DIR/ghidra-genx"
          mkdir -p vault
          tar --zstd -cf "$RUNNER_TEMP/genx-toolchain-linux-x86_64.tar.zst" -C "$RUNNER_TEMP" generation-x-toolchain
          split -b 900m -d -a 3 "$RUNNER_TEMP/genx-toolchain-linux-x86_64.tar.zst" vault/genx-toolchain-linux-x86_64.tar.zst.part.
          cat > vault/README.txt <<'EOF'
          Repository-owned Generation X Linux x86_64 toolchain cache.
          Built from this repository's setup-dev-env.sh. Contains no ROMs, firmware, console keys, title keys, or decrypted game images.
          EOF
          (cd vault && sha256sum * > SHA256SUMS.txt)
      - name: Publish permanent repository-owned vault
        shell: bash
        run: |
          set -euxo pipefail
          tag='genx-toolchain-linux-x86_64-v1'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" vault/* --clobber
          else
            gh release create "$tag" vault/* --target "$GITHUB_SHA" --title 'Generation X toolchain — Linux x86_64' --notes 'Prebuilt repository-owned analysis environment generated from setup-dev-env.sh. No game images, firmware, or keys.'
          fi
      - name: Commit one-command loader
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tools
          cat > tools/use_repo_toolchain.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          CACHE="${GENX_REPO_TOOLCHAIN_CACHE:-$ROOT/.repo-toolchain}"
          HOME_DIR="$CACHE/generation-x-toolchain"
          if [[ ! -x "$HOME_DIR/bin/ghidra-genx" ]]; then
            mkdir -p "$CACHE/parts"
            api='https://api.github.com/repos/SakuraiTsubaki/PocketMonsters-Winds-Decompilation/releases/tags/genx-toolchain-linux-x86_64-v1'
            python3 - "$api" "$CACHE/parts" <<'PY'
          import json, pathlib, sys, urllib.request
          api=sys.argv[1]; out=pathlib.Path(sys.argv[2]); out.mkdir(parents=True,exist_ok=True)
          with urllib.request.urlopen(api) as r: data=json.load(r)
          assets=sorted((a for a in data['assets'] if a['name'].startswith('genx-toolchain-linux-x86_64.tar.zst.part.')), key=lambda a:a['name'])
          if not assets: raise SystemExit('Generation X toolchain vault assets not found')
          for a in assets:
              dst=out/a['name']
              if not dst.exists(): urllib.request.urlretrieve(a['browser_download_url'], dst)
          PY
            cat "$CACHE"/parts/genx-toolchain-linux-x86_64.tar.zst.part.* > "$CACHE/genx-toolchain-linux-x86_64.tar.zst"
            tar --zstd -xf "$CACHE/genx-toolchain-linux-x86_64.tar.zst" -C "$CACHE"
          fi
          export GENX_TOOLCHAIN_HOME="$HOME_DIR"
          export PATH="$HOME_DIR/bin:$HOME_DIR/python/bin:$HOME/.cargo/bin:$PATH"
          echo "repository Generation X toolchain active: $HOME_DIR"
          EOF
          chmod +x tools/use_repo_toolchain.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/use_repo_toolchain.sh
          git diff --cached --quiet && exit 0
          git commit -m 'tooling: add repository Generation X toolchain loader'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
