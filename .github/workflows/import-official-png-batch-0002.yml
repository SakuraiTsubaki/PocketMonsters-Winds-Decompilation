name: Import official PNG batch 0002

on:
  push:
    paths:
      - '.github/workflows/import-official-png-batch-0002.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Japanese PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/public/jp/2026-02-27/logos
          mkdir -p assets/public/jp/2026-02-27/characters

          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/images/ja/image_001.png' \
            --output assets/public/jp/2026-02-27/logos/image_001.png
          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/images/ja/image_002.png' \
            --output assets/public/jp/2026-02-27/logos/image_002.png
          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/images/image_150.png' \
            --output assets/public/jp/2026-02-27/characters/image_150.png
          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/images/image_151.png' \
            --output assets/public/jp/2026-02-27/characters/image_151.png
          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/images/image_152.png' \
            --output assets/public/jp/2026-02-27/characters/image_152.png

      - name: Verify PNG signatures and record hashes
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            assets/public/jp/2026-02-27/logos/image_001.png \
            assets/public/jp/2026-02-27/logos/image_002.png \
            assets/public/jp/2026-02-27/characters/image_150.png \
            assets/public/jp/2026-02-27/characters/image_151.png \
            assets/public/jp/2026-02-27/characters/image_152.png; do
            test "$(xxd -p -l 8 "$f")" = '89504e470d0a1a0a'
          done
          sha256sum \
            assets/public/jp/2026-02-27/logos/image_001.png \
            assets/public/jp/2026-02-27/logos/image_002.png \
            assets/public/jp/2026-02-27/characters/image_150.png \
            assets/public/jp/2026-02-27/characters/image_151.png \
            assets/public/jp/2026-02-27/characters/image_152.png \
            > /tmp/png-batch-0002.sha256
          cat /tmp/png-batch-0002.sha256

      - name: Commit PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/public/jp/2026-02-27/logos assets/public/jp/2026-02-27/characters
          if git diff --cached --quiet; then
            echo 'No PNG changes to commit.'
            exit 0
          fi
          git commit -m 'Add official Japanese PNG assets batch 0002'
          git push
