name: Import official PNG batch 0004

on:
  push:
    paths:
      - '.github/workflows/import-official-png-batch-0004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Japanese PNG section graphics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/public/jp/2026-02-27/title

          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/title/ja/image_013.png' \
            --output assets/public/jp/2026-02-27/title/image_013.png
          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/title/ja/image_014.png' \
            --output assets/public/jp/2026-02-27/title/image_014.png
          curl --fail --location --retry 3 \
            'https://www.pokemon.co.jp/ex/winds_waves/title/ja/image_030.png' \
            --output assets/public/jp/2026-02-27/title/image_030.png

      - name: Verify PNG signatures
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            assets/public/jp/2026-02-27/title/image_013.png \
            assets/public/jp/2026-02-27/title/image_014.png \
            assets/public/jp/2026-02-27/title/image_030.png; do
            test "$(xxd -p -l 8 "$f")" = '89504e470d0a1a0a'
          done
          sha256sum \
            assets/public/jp/2026-02-27/title/image_013.png \
            assets/public/jp/2026-02-27/title/image_014.png \
            assets/public/jp/2026-02-27/title/image_030.png

      - name: Commit PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/public/jp/2026-02-27/title
          if git diff --cached --quiet; then
            echo 'No PNG changes to commit.'
            exit 0
          fi
          git commit -m 'Add official Japanese PNG assets batch 0004'
          git push
