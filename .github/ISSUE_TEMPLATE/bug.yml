name: Bug / Glitch / Error
about: Track a reproducible defect through verification and fix
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use this form for crashes, glitches, logic errors, data errors, regressions, localization defects, performance defects, and other unintended behavior."
  - type: input
    id: build
    attributes:
      label: Target build
      description: Release/update/DLC, region, language, and build/hash information when available.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - data loss / boot failure / widespread fatal failure
        - P1 - progression blocker / crash / severe corruption
        - P2 - major gameplay or system malfunction
        - P3 - limited functional or presentation defect
        - P4 - minor defect
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: battle, save, map, event, UI, localization, performance, online, etc.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give deterministic steps and frequency when known.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, hashes, traces, save state references, or other non-ROM evidence.
    validations:
      required: true
  - type: textarea
    id: rootcause
    attributes:
      label: Root cause / investigation notes
      description: Leave as unknown until established; do not guess.
  - type: textarea
    id: fix
    attributes:
      label: Fix and regression verification
      description: Link the implementation/patch and the test or repeatable verification procedure.
  - type: checkboxes
    id: parity
    attributes:
      label: Cross-version checks
      options:
        - label: Corresponding Waves code/data path has been checked or explicitly queued.
        - label: Original behavior has been preserved in documentation before closure.
