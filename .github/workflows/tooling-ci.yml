name: Tooling CI

on:
  push:
    paths:
      - "tools/**"
      - "manifests/*.schema.json"
      - ".github/workflows/tooling-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "manifests/*.schema.json"
      - ".github/workflows/tooling-ci.yml"

jobs:
  test-metadata-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Create synthetic fixtures
        run: |
          mkdir -p .ci/left .ci/right .ci/extracted
          printf 'alpha\n' > .ci/left/a.bin
          printf 'alpha\n' > .ci/right/a.bin
          printf 'beta\n' > .ci/right/b.dat
          printf 'synthetic-main\n' > .ci/extracted/main
          printf 'synthetic-container\n' > .ci/extracted/assets.pak

      - name: Exercise target inventory
        run: |
          python tools/inventory_target.py .ci/left --target-id synthetic-left --product synthetic --output .ci/left.json
          python tools/inventory_target.py .ci/right --target-id synthetic-right --product synthetic --output .ci/right.json

      - name: Exercise inventory comparison
        run: python tools/compare_inventories.py .ci/left.json .ci/right.json --output .ci/diff.json

      - name: Exercise extracted target mapper
        run: python tools/map_extracted_target.py .ci/extracted --target-id synthetic-map --output .ci/map.json

      - name: Validate expected synthetic results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          left = json.loads(Path('.ci/left.json').read_text())
          diff = json.loads(Path('.ci/diff.json').read_text())
          mapped = json.loads(Path('.ci/map.json').read_text())
          assert left['file_count'] == 1
          assert diff['summary']['added'] == 1
          assert len(mapped['modules']) == 1
          assert len(mapped['containers']) == 1
          print('synthetic metadata tooling checks passed')
          PY
