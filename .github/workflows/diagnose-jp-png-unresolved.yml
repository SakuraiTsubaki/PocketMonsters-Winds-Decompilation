name: Diagnose unresolved Japanese PNG tokens

on:
  push:
    paths:
      - '.github/workflows/diagnose-jp-png-unresolved.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Trace image_1100 and image_1101 token contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from collections import deque
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen

          HOST='www.pokemon.co.jp'; SITE='/ex/winds_waves/'
          pages=[
            'https://www.pokemon.co.jp/ex/winds_waves/ja/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/pokemon/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/news/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/news/202605_01/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/news/202602_01/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/news/202602_02/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/news/202602_03/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/pokemon/202602_01/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/pokemon/202602_02/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/pokemon/202602_03/',
            'https://www.pokemon.co.jp/ex/winds_waves/ja/pokemon/202602_04/'
          ]
          targets=['image_1100.png','image_1101.png']

          class P(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]
            def handle_starttag(self,tag,attrs):
              for k,v in attrs:
                if v and k in {'src','href'} and ('.js' in v or '.css' in v): self.links.append(v)

          def norm(base,raw):
            u=urljoin(base,raw); p=urlparse(u)
            if p.netloc!=HOST or not p.path.startswith(SITE): return None
            return f'https://{HOST}{p.path}'

          def get(u):
            req=Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; Generation-X-token-diagnostic/1.0)'})
            with urlopen(req,timeout=6) as r: return r.read().decode('utf-8','ignore')

          resources=deque(); seen=set(); matches=[]; errors=[]
          for page in pages:
            try: text=get(page)
            except Exception as e: errors.append({'url':page,'stage':'html','error':repr(e)}); continue
            for target in targets:
              for m in re.finditer(re.escape(target),text):
                matches.append({'target':target,'source':page,'kind':'html','context':text[max(0,m.start()-220):m.end()+220]})
            p=P(); p.feed(text)
            for raw in p.links:
              u=norm(page,raw)
              if u: resources.append(u)

          token_res=re.compile(r'''(?:https?:)?//[^\s"'<>]+?\.(?:js|css)(?:\?[^\s"'<>)]*)?|(?:\.\.?/|/)[^\s"'<>]+?\.(?:js|css)(?:\?[^\s"'<>)]*)?|[A-Za-z0-9_./%-]+\.(?:js|css)(?:\?[^\s"'<>)]*)?''',re.I)
          while resources and len(seen)<250:
            u=resources.popleft()
            if u in seen: continue
            seen.add(u)
            try: text=get(u)
            except Exception as e: errors.append({'url':u,'stage':'resource','error':repr(e)}); continue
            for target in targets:
              for m in re.finditer(re.escape(target),text):
                matches.append({'target':target,'source':u,'kind':'resource','context':text[max(0,m.start()-300):m.end()+300]})
            for m in token_res.finditer(text):
              x=norm(u,m.group(0))
              if x and x not in seen: resources.append(x)

          out={'research_date':'2026-09-15','targets':targets,'pages_checked':pages,'resources_successfully_scanned':len(seen)-sum(1 for e in errors if e['stage']=='resource'),'resource_candidates_seen':len(seen),'match_count':len(matches),'matches':matches,'errors':errors}
          Path('manifests/jp-png-unresolved-context.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'resource_candidates_seen':len(seen),'match_count':len(matches)},indent=2))
          for x in matches: print('\nTARGET',x['target'],'SOURCE',x['source'],'\n',x['context'][:1000])
          PY

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/jp-png-unresolved-context.json
          git commit -m 'Trace unresolved Japanese PNG token contexts'
          git push
