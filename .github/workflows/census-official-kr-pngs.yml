name: Census all official Korean PNG assets

on:
  push:
    paths:
      - '.github/workflows/census-official-kr-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr-official-png-census
  cancel-in-progress: true

jobs:
  census-png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crawl Korean official Winds/Waves surface and import PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from collections import deque
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qsl, urlencode, unquote
          from urllib.request import Request, urlopen

          ROOT='https://pokemonkorea.co.kr/winds_waves'
          OFFICIAL_HOSTS={'pokemonkorea.co.kr','www.pokemonkorea.co.kr'}
          PAGE_PREFIX='/winds_waves'
          MAX_PAGES=200
          MAX_RESOURCES=300
          OUT=Path('assets/public/kr/site')
          MANIFEST=Path('manifests/kr-public-png-census.json')
          OUT.mkdir(parents=True,exist_ok=True)
          MANIFEST.parent.mkdir(parents=True,exist_ok=True)

          SEEDS=[
            ROOT,
            'https://pokemonkorea.co.kr/winds_waves/menu724?stype1=&stype2=',
            'https://pokemonkorea.co.kr/winds_waves/menu724?mode=view&number=4176&stype1=&stype2=',
            'https://pokemonkorea.co.kr/winds_waves/menu724?mode=view&number=4177&stype1=&stype2=',
            'https://pokemonkorea.co.kr/winds_waves/menu724?mode=view&number=4178&stype1=&stype2=',
            'https://pokemonkorea.co.kr/winds_waves/menu724?mode=view&number=4179&stype1=&stype2=',
            'https://pokemonkorea.co.kr/winds_waves/menu725',
            'https://pokemonkorea.co.kr/winds_waves/menu725?mode=view&number=4180',
            'https://pokemonkorea.co.kr/winds_waves/menu725?mode=view&number=4181'
          ]

          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.attrs=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if v and k in {'href','src','srcset','poster','style'}:
                          self.attrs.append((tag,k,v))

          file_token=re.compile(r'''(?P<u>(?:https?:)?//[^\s"'<>]+?\.(?:png|css|js)(?:\?[^\s"'<>)]*)?|(?:\.\.?/|/)[^\s"'<>]+?\.(?:png|css|js)(?:\?[^\s"'<>)]*)?|[A-Za-z0-9_@%+./:-]+\.(?:png|css|js)(?:\?[^\s"'<>)]*)?)''',re.I)
          css_url=re.compile(r'''url\(\s*["']?([^"')]+)["']?\s*\)''',re.I)

          def canonical_page(base,raw):
              if not raw or raw.startswith(('javascript:','mailto:','#')): return None
              u=urljoin(base,raw); p=urlparse(u)
              if p.scheme not in {'http','https'} or p.netloc.lower() not in OFFICIAL_HOSTS or not p.path.startswith(PAGE_PREFIX): return None
              q=[(k,v) for k,v in parse_qsl(p.query,keep_blank_values=True) if not k.lower().startswith(('utm_','fbclid','gclid'))]
              q.sort()
              return urlunparse(('https','pokemonkorea.co.kr',p.path,'',urlencode(q,doseq=True),''))

          def canonical_asset(base,raw):
              if not raw or raw.startswith(('data:','javascript:','mailto:','#')): return None
              raw=raw.strip().strip('"\'').replace('\\/','/')
              u=urljoin(base,raw); p=urlparse(u)
              if p.scheme not in {'http','https'}: return None
              return urlunparse((p.scheme,p.netloc,p.path,'',p.query,''))

          def fetch(url,binary=False,timeout=8):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Generation-X-KR-PNG-census/1.0)'})
              with urlopen(req,timeout=timeout) as r:
                  b=r.read(); final=r.geturl()
              return (b,final) if binary else (b.decode('utf-8','ignore'),final)

          # Canonical hash inventory across JP and any prior assets: byte-identical KR assets are referenced, not duplicated.
          hash_to_path={}
          for f in sorted(Path('assets').rglob('*.png')) if Path('assets').exists() else []:
              try: hash_to_path.setdefault(hashlib.sha256(f.read_bytes()).hexdigest(),f.as_posix())
              except OSError: pass

          pages=deque(SEEDS); seen_pages=set(); resources=deque(); seen_resources=set(); png_sources={}; crawl_errors=[]
          while pages and len(seen_pages)<MAX_PAGES:
              requested=pages.popleft()
              page=canonical_page(ROOT,requested) or requested
              if page in seen_pages: continue
              seen_pages.add(page)
              try: text,final=fetch(page)
              except Exception as e:
                  crawl_errors.append({'url':page,'stage':'html','error':repr(e)}); continue
              base=final
              parser=Parser()
              try: parser.feed(text)
              except Exception as e: crawl_errors.append({'url':page,'stage':'html-parse','error':repr(e)})

              for tag,k,v in parser.attrs:
                  values=[v]
                  if k=='srcset': values=[x.strip().split()[0] for x in v.split(',') if x.strip()]
                  elif k=='style': values=[m.group(1) for m in css_url.finditer(v)]
                  for raw in values:
                      a=canonical_asset(base,raw)
                      if a:
                          lower=urlparse(a).path.lower()
                          if lower.endswith('.png'): png_sources.setdefault(a,set()).add(page)
                          elif lower.endswith(('.css','.js')): resources.append(a)
                      if tag=='a' and k=='href':
                          p=canonical_page(base,raw)
                          if p: pages.append(p)

              for m in file_token.finditer(text):
                  a=canonical_asset(base,m.group('u'))
                  if not a: continue
                  lower=urlparse(a).path.lower()
                  if lower.endswith('.png'): png_sources.setdefault(a,set()).add(page)
                  elif lower.endswith(('.css','.js')): resources.append(a)

          while resources and len(seen_resources)<MAX_RESOURCES:
              requested=resources.popleft()
              if requested in seen_resources: continue
              seen_resources.add(requested)
              try: text,final=fetch(requested)
              except Exception as e:
                  crawl_errors.append({'url':requested,'stage':'resource','error':repr(e)}); continue
              for m in file_token.finditer(text):
                  a=canonical_asset(final,m.group('u'))
                  if not a: continue
                  lower=urlparse(a).path.lower()
                  if lower.endswith('.png'): png_sources.setdefault(a,set()).add(requested)
                  elif lower.endswith(('.css','.js')) and len(seen_resources)+len(resources)<MAX_RESOURCES*2: resources.append(a)
              for m in css_url.finditer(text):
                  a=canonical_asset(final,m.group(1))
                  if a and urlparse(a).path.lower().endswith('.png'): png_sources.setdefault(a,set()).add(requested)

          def download(url):
              try:
                  b,final=fetch(url,True,12)
                  if not b.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('invalid PNG signature')
                  return url,b,final,None
              except Exception as e: return url,None,None,repr(e)

          results={}
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs=[ex.submit(download,u) for u in sorted(png_sources)]
              for fut in as_completed(futs):
                  u,b,final,e=fut.result(); results[u]=(b,final,e)

          entries=[]; new_files=[]
          for u in sorted(png_sources):
              b,final,e=results[u]
              provenance=sorted(png_sources[u])
              if e:
                  entries.append({'source_url':u,'discovered_from':provenance,'status':'download-error','error':e}); continue
              h=hashlib.sha256(b).hexdigest(); existing=hash_to_path.get(h)
              if existing:
                  repo_path=existing; dedup=True
              else:
                  p=urlparse(final or u); host=p.netloc.lower().replace(':','_')
                  rel=unquote(p.path).lstrip('/') or 'index.png'
                  rel=os.path.normpath(rel).replace('\\','/')
                  if rel=='..' or rel.startswith('../'): rel=Path(rel).name
                  dest=OUT/host/rel; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(b)
                  repo_path=dest.as_posix(); hash_to_path[h]=repo_path; new_files.append(repo_path); dedup=False
              entries.append({'source_url':u,'final_url':final,'discovered_from':provenance,'repository_path':repo_path,'sha256':h,'size':len(b),'deduplicated_to_existing':dedup,'status':'verified-png'})

          manifest={
            'schema_version':1,'research_date':'2026-09-15','region':'KR','baseline_relation':'Compared against the Japanese canonical asset inventory by SHA-256.','root_url':ROOT,
            'scope':'Official Pokémon Korea Winds/Waves pages reachable from seeded and discovered same-site links plus linked CSS/JS PNG references.',
            'limits':{'max_html_pages':MAX_PAGES,'max_text_resources':MAX_RESOURCES},
            'html_pages_crawled':len(seen_pages),'text_resources_scanned':len(seen_resources),'png_urls_discovered':len(png_sources),
            'verified_png_count':sum(1 for e in entries if e.get('status')=='verified-png'),
            'download_error_count':sum(1 for e in entries if e.get('status')=='download-error'),
            'new_unique_png_count':len(new_files),
            'deduplicated_existing_count':sum(1 for e in entries if e.get('deduplicated_to_existing') is True),
            'entries':entries,'crawl_errors':crawl_errors,
            'completion_note':'Current reachable Korean official surface census. Any download/crawl errors remain explicit; later page revisions require rerun.'}
          MANIFEST.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/kr_new_png_files.txt').write_text('\n'.join(new_files)+('\n' if new_files else ''),encoding='utf-8')
          print(json.dumps({k:manifest[k] for k in ['html_pages_crawled','text_resources_scanned','png_urls_discovered','verified_png_count','download_error_count','new_unique_png_count','deduplicated_existing_count']},indent=2))
          PY

      - name: Commit Korean PNGs first in small batches, then manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t files < /tmp/kr_new_png_files.txt
          n=${#files[@]}; batch=1
          for ((i=0;i<n;i+=8)); do
            chunk=("${files[@]:i:8}")
            git add -- "${chunk[@]}"
            git commit -m "Add Korean official PNG census chunk $(printf '%03d' "$batch")"
            batch=$((batch+1))
          done
          git add manifests/kr-public-png-census.json
          if ! git diff --cached --quiet; then git commit -m 'Record Korean official PNG census manifest'; fi
          git push
