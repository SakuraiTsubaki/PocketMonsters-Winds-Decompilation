name: Resolve Japanese PNG census paths

on:
  push:
    paths:
      - '.github/workflows/resolve-jp-png-census-errors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jp-png-error-resolver
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mis-based PNG candidates against official directories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlparse, unquote
          from urllib.request import Request, urlopen

          BASE='https://www.pokemon.co.jp/ex/winds_waves/'
          SITE='/ex/winds_waves/'
          MANIFEST=Path('manifests/jp-public-png-census.json')
          OUT=Path('assets/public/jp/site')
          data=json.loads(MANIFEST.read_text(encoding='utf-8'))

          hash_to_path={}
          for f in sorted(Path('assets').rglob('*.png')):
              try: hash_to_path.setdefault(hashlib.sha256(f.read_bytes()).hexdigest(),f.as_posix())
              except OSError: pass

          prefixes=['images/','images/ja/','images/sc/','images/tc/','title/ja/','title/ja/pc/','icons/','ja/','ja/images/','']

          def fetch_png(url):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Generation-X-PNG-resolver/1.0)'})
              with urlopen(req,timeout=5) as r: b=r.read()
              if not b.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('invalid PNG signature')
              return b

          def candidate_urls(source):
              p=urlparse(source).path
              tail=p.split('/assets/',1)[1] if '/assets/' in p else PurePosixPath(p).name
              tail=tail.lstrip('/')
              name=PurePosixPath(tail).name
              candidates=[]
              # Preserve any locale subdirectory from the bad /assets/ path first.
              for rel in [tail,name]:
                  for pref in prefixes:
                      u=BASE+pref+rel
                      if u not in candidates: candidates.append(u)
              return candidates

          def resolve(entry):
              attempts=[]
              for u in candidate_urls(entry['source_url']):
                  attempts.append(u)
                  try:
                      b=fetch_png(u)
                      return entry,u,b,attempts,None
                  except Exception:
                      pass
              return entry,None,None,attempts,'not-found-in-tested-official-prefixes'

          errors=[e for e in data['entries'] if e.get('status')=='download-error']
          resolved_map={}
          with ThreadPoolExecutor(max_workers=20) as ex:
              futs=[ex.submit(resolve,e) for e in errors]
              for f in as_completed(futs):
                  e,u,b,attempts,err=f.result(); resolved_map[e['source_url']]=(u,b,attempts,err)

          new_files=[]; resolved=0; unresolved=0
          for e in data['entries']:
              if e.get('status')!='download-error': continue
              u,b,attempts,err=resolved_map[e['source_url']]
              e['resolution_attempts']=attempts
              if not u:
                  e['resolution_status']='unresolved'; e['resolution_error']=err; unresolved+=1; continue
              h=hashlib.sha256(b).hexdigest(); existing=hash_to_path.get(h)
              if existing:
                  repo_path=existing; dedup=True
              else:
                  rel=unquote(urlparse(u).path[len(SITE):]).lstrip('/')
                  rel=os.path.normpath(rel).replace('\\','/')
                  dest=OUT/rel; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(b)
                  repo_path=dest.as_posix(); hash_to_path[h]=repo_path; new_files.append(repo_path); dedup=False
              e.update({'status':'verified-png-resolved','resolved_url':u,'repository_path':repo_path,'sha256':h,'size':len(b),'deduplicated_to_existing':dedup,'resolution_status':'resolved'})
              e.pop('error',None); e.pop('resolution_error',None); resolved+=1

          data['resolver']={'date':'2026-09-15','tested_prefixes':prefixes,'resolved_count':resolved,'unresolved_count':unresolved,'new_unique_png_count':len(new_files)}
          data['verified_png_count']=sum(1 for e in data['entries'] if e.get('status') in {'verified-png','verified-png-resolved'})
          data['download_error_count']=sum(1 for e in data['entries'] if e.get('status')=='download-error')
          data['remaining_unresolved_count']=sum(1 for e in data['entries'] if e.get('resolution_status')=='unresolved')
          MANIFEST.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/resolved_new_files.txt').write_text('\n'.join(new_files)+('\n' if new_files else ''),encoding='utf-8')
          print(json.dumps(data['resolver'],indent=2))
          print('verified_png_count=',data['verified_png_count'])
          print('remaining_unresolved_count=',data['remaining_unresolved_count'])
          PY

      - name: Commit resolved PNGs first, then corrected manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t files < /tmp/resolved_new_files.txt
          n=${#files[@]}; batch=1
          for ((i=0;i<n;i+=8)); do
            chunk=("${files[@]:i:8}")
            git add -- "${chunk[@]}"
            git commit -m "Add resolved Japanese official PNG chunk $(printf '%03d' "$batch")"
            batch=$((batch+1))
          done
          git add manifests/jp-public-png-census.json
          git commit -m 'Resolve Japanese PNG census source paths'
          git push
